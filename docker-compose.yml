# Settings come from a git-ignored .env file next to this one (copy .env.example to .env).
# Never put credentials directly in this file: it is tracked in git.
services:
  postbox:
    build: .
    image: postbox:local
    container_name: postbox
    restart: unless-stopped
    ports:
      - "${POSTBOX_PORT:-3000}:3000"
    volumes:
      - postbox-data:/data
    environment:
      DATABASE_PATH: /data/postbox.db
      # Authentication (recommended). Empty values leave Postbox open.
      POSTBOX_PASSWORD: ${POSTBOX_PASSWORD:-}
      POSTBOX_TOKEN: ${POSTBOX_TOKEN:-}
      POSTBOX_SESSION_DAYS: ${POSTBOX_SESSION_DAYS:-30}
      # Outgoing request policy and limits (see README).
      PROXY_ALLOW_HOSTS: ${PROXY_ALLOW_HOSTS:-}
      PROXY_DENY_HOSTS: ${PROXY_DENY_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      SCRIPT_TIMEOUT_MS: ${SCRIPT_TIMEOUT_MS:-5000}
      SCRIPT_MEMORY_MB: ${SCRIPT_MEMORY_MB:-32}

volumes:
  postbox-data:
