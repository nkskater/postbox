services:
  postbox:
    build: .
    image: postbox:local
    container_name: postbox
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - postbox-data:/data
    environment:
      DATABASE_PATH: /data/postbox.db
      # Authentication (recommended, see README):
      # POSTBOX_PASSWORD: "change-me"
      # POSTBOX_TOKEN: "long-random-token-for-mcp-and-scripts"
      # Optional hardening:
      # PROXY_ALLOW_HOSTS: "*.internal.example.com,10.0.0.0/8"
      # PROXY_DENY_HOSTS: "169.254.169.254"
      # SCRIPT_TIMEOUT_MS: "5000"
      # SCRIPT_MEMORY_MB: "32"

volumes:
  postbox-data:
