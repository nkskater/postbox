# Settings come from a git-ignored .env file next to this one (copy .env.example to .env).
# Never put credentials directly in this file: it is tracked in git.
services:
  postbox:
    build: .
    image: postbox:local
    container_name: postbox
    restart: unless-stopped
    # Runtime limits for the whole app, including scripts and collection runs.
    mem_limit: ${POSTBOX_MEMORY_LIMIT:-1g}
    cpus: ${POSTBOX_CPU_LIMIT:-2.0}
    pids_limit: ${POSTBOX_PIDS_LIMIT:-256}
    ports:
      - "${POSTBOX_PORT:-3000}:3000"
    volumes:
      - postbox-data:/data
    environment:
      DATABASE_PATH: /data/postbox.db
      # Authentication (recommended). Empty values leave Postbox open.
      POSTBOX_PASSWORD: ${POSTBOX_PASSWORD:-}
      POSTBOX_TOKEN: ${POSTBOX_TOKEN:-}
      POSTBOX_SESSION_DAYS: ${POSTBOX_SESSION_DAYS:-30}
      # Outgoing request policy and limits (see README).
      PROXY_ALLOW_HOSTS: ${PROXY_ALLOW_HOSTS:-}
      PROXY_DENY_HOSTS: ${PROXY_DENY_HOSTS:-}
      PROXY_ALLOW_SOCKETS: ${PROXY_ALLOW_SOCKETS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      API_BODY_LIMIT_MB: ${API_BODY_LIMIT_MB:-25}
      # Empty = configurable under Settings → Request execution; a value pins it.
      SCRIPT_TIMEOUT_MS: ${SCRIPT_TIMEOUT_MS:-}
      SCRIPT_MEMORY_MB: ${SCRIPT_MEMORY_MB:-}
      RUNS_MAX_ACTIVE: ${RUNS_MAX_ACTIVE:-}
      RUNS_MAX_QUEUED: ${RUNS_MAX_QUEUED:-}

volumes:
  postbox-data:
