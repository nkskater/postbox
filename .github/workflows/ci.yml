name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-package:
    name: Build and smoke test portable Windows package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:windows
      - name: Smoke test packaged Windows app, local proxy execution, CLI, and shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dist/Postbox-windows-x64.zip -DestinationPath smoke
          $root = Join-Path $PWD 'smoke\Postbox'
          $env:NO_BROWSER = '1'
          $data = Join-Path $root 'CustomData'
          Set-Content -Path (Join-Path $root 'Settings.cmd') -Value ('set "DATA_DIR=' + $data + '"' + "`r`nset PORT=47392") -Encoding ascii
          $base = 'http://127.0.0.1:47392'

          function Start-App {
            $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', ('"' + (Join-Path $root 'Postbox.cmd') + '"') -PassThru -NoNewWindow
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $h = Invoke-RestMethod "$base/api/health" -TimeoutSec 2
                if ($h.status -eq 'ok' -and $h.app -eq 'postbox') { return $p }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw 'Packaged Windows app did not start'
          }

          $p = Start-App
          try {
            if (-not (Test-Path (Join-Path $data 'postbox.db'))) { throw 'Database not created in Settings.cmd DATA_DIR' }
            $workspaces = @(Invoke-RestMethod "$base/api/workspaces")
            $wsId = $workspaces[0].id
            if (-not $wsId) { throw 'Default workspace was not created' }

            # Execute a request through /api/proxy against the local loopback interface
            $proxyBody = @{
              workspaceId = $wsId
              request = @{
                id = 'req-smoke'
                name = 'Local Health Check'
                method = 'GET'
                url = "$base/api/health"
                params = @()
                headers = @()
                auth = @{ type = 'none' }
                body = @{ mode = 'none' }
              }
            } | ConvertTo-Json -Depth 6
            $proxyRes = Invoke-RestMethod -Method Post "$base/api/proxy" -Body $proxyBody -ContentType 'application/json'
            if ($proxyRes.response.status -ne 200) { throw "Unexpected proxy status: $($proxyRes.response.status)" }

            # Second launch must detect the running copy and exit 0
            $second = Start-Process -FilePath cmd.exe -ArgumentList '/c', ('"' + (Join-Path $root 'Postbox.cmd') + '"') -PassThru -NoNewWindow
            if (-not $second.WaitForExit(30000)) { throw 'Second launch did not exit' }
            if ($second.ExitCode -ne 0) { throw "Second launch failed with $($second.ExitCode)" }
          } finally {
            & taskkill.exe /T /F /PID $p.Id | Out-Null
          }

          Start-Sleep -Seconds 1
          # Restart and verify automatic daily backup is created in Backups\
          $p2 = Start-App
          try {
            if (-not (Get-ChildItem (Join-Path $data 'Backups') -Filter 'postbox-*.db')) {
              throw 'Daily backup was not created in Backups\'
            }
          } finally {
            & taskkill.exe /T /F /PID $p2.Id | Out-Null
          }

          # Bundled CLI works via Postbox CLI.cmd
          $cliVer = & cmd.exe /c ('"' + (Join-Path $root 'Postbox CLI.cmd') + '" --version')
          if ($LASTEXITCODE -ne 0) { throw 'Postbox CLI.cmd failed' }

          # Desktop shortcut creator works
          'x' | cmd.exe /c ('"' + (Join-Path $root 'Create desktop shortcut.cmd') + '"')
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Postbox.lnk'
          if (-not (Test-Path $lnk)) { throw 'Desktop shortcut was not created' }
          Write-Host 'Packaged Windows edition OK'
      - uses: actions/upload-artifact@v4
        with:
          name: Postbox-windows-x64
          path: dist/Postbox-windows-x64.zip
          compression-level: 0
      - name: Attach Windows zip to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Postbox-windows-x64.zip --clobber
          } else {
            gh release create $tag dist/Postbox-windows-x64.zip --title $tag --generate-notes
          }

  docker:
    name: Build and smoke test container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: postbox:smoke
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - name: Check container health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs postbox-smoke; docker rm -fv postbox-smoke' EXIT
          docker run --detach --name postbox-smoke --publish 127.0.0.1:3000:3000 postbox:smoke
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --max-time 5 http://127.0.0.1:3000/api/health

  publish:
    name: Publish multi-platform image
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/nkskater/postbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-multiarch
          cache-to: type=gha,mode=max,scope=container-multiarch
