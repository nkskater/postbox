name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tools/development-workflow/*.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the VS Code extension
        run: npm run build:vscode
      - name: Check startup memory
        run: npm run check:memory

  browser-tests:
    name: Browser smoke tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  windows-package:
    name: Build and smoke test portable Windows package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:windows
      - name: Smoke test packaged Windows app, local proxy execution, CLI, and shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dist/Postbox-windows-x64.zip -DestinationPath smoke
          $root = Join-Path $PWD 'smoke\Postbox'
          $env:NO_BROWSER = '1'
          $data = Join-Path $root 'CustomData'
          Set-Content -Path (Join-Path $root 'Settings.cmd') -Value ('set "DATA_DIR=' + $data + '"' + "`r`nset PORT=47392") -Encoding ascii
          $base = 'http://127.0.0.1:47392'

          function Start-App {
            $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', ('"' + (Join-Path $root 'Postbox.cmd') + '"') -PassThru -NoNewWindow
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $h = Invoke-RestMethod "$base/api/health" -TimeoutSec 2
                if ($h.status -eq 'ok' -and $h.app -eq 'postbox') { return $p }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw 'Packaged Windows app did not start'
          }

          $p = Start-App
          try {
            if (-not (Test-Path (Join-Path $data 'postbox.db'))) { throw 'Database not created in Settings.cmd DATA_DIR' }
            $workspaces = @(Invoke-RestMethod "$base/api/workspaces")
            $wsId = $workspaces[0].id
            if (-not $wsId) { throw 'Default workspace was not created' }

            # Execute a request through /api/proxy against the local loopback interface
            $proxyBody = @{
              workspaceId = $wsId
              request = @{
                id = 'req-smoke'
                name = 'Local Health Check'
                method = 'GET'
                url = "$base/api/health"
                params = @()
                headers = @()
                auth = @{ type = 'none' }
                body = @{ mode = 'none' }
              }
            } | ConvertTo-Json -Depth 6
            $proxyRes = Invoke-RestMethod -Method Post "$base/api/proxy" -Body $proxyBody -ContentType 'application/json'
            if ($proxyRes.response.status -ne 200) { throw "Unexpected proxy status: $($proxyRes.response.status)" }

            # Second launch must detect the running copy and exit 0
            $second = Start-Process -FilePath cmd.exe -ArgumentList '/c', ('"' + (Join-Path $root 'Postbox.cmd') + '"') -PassThru -NoNewWindow
            if (-not $second.WaitForExit(30000)) { throw 'Second launch did not exit' }
            if ($second.ExitCode -ne 0) { throw "Second launch failed with $($second.ExitCode)" }
          } finally {
            & taskkill.exe /T /F /PID $p.Id | Out-Null
          }

          Start-Sleep -Seconds 1
          # Restart and verify automatic daily backup is created in Backups\ and scripted CLI runs
          $p2 = Start-App
          try {
            if (-not (Get-ChildItem (Join-Path $data 'Backups') -Filter 'postbox-*.db')) {
              throw 'Daily backup was not created in Backups\'
            }
            $colPath = Join-Path $root 'smoke-collection.json'
            $colJson = @{
              info = @{
                name = 'Windows CLI Smoke'
                schema = 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json'
              }
              item = @(
                @{
                  name = 'Health Check With QuickJS'
                  request = @{
                    method = 'GET'
                    url = "$base/api/health"
                  }
                  event = @(
                    @{
                      listen = 'prerequest'
                      script = @{ exec = @('pm.variables.set("fromScript", "ok");') }
                    },
                    @{
                      listen = 'test'
                      script = @{
                        exec = @(
                          'pm.test("status 200 and QuickJS variable set", function () {'
                          '  pm.response.to.have.status(200);'
                          '  pm.expect(pm.variables.get("fromScript")).to.eql("ok");'
                          '});'
                        )
                      }
                    }
                  )
                }
              )
            } | ConvertTo-Json -Depth 10
            Set-Content -Path $colPath -Value $colJson -Encoding utf8
            & cmd.exe /c ('"' + (Join-Path $root 'Postbox CLI.cmd') + '" run "' + $colPath + '" --bail')
            if ($LASTEXITCODE -ne 0) { throw "Postbox CLI.cmd scripted collection run failed with $LASTEXITCODE" }
          } finally {
            & taskkill.exe /T /F /PID $p2.Id | Out-Null
          }

          # Bundled CLI --version works via Postbox CLI.cmd
          $cliVer = & cmd.exe /c ('"' + (Join-Path $root 'Postbox CLI.cmd') + '" --version')
          if ($LASTEXITCODE -ne 0) { throw 'Postbox CLI.cmd --version failed' }

          # Desktop shortcut creator works
          'x' | cmd.exe /c ('"' + (Join-Path $root 'Create desktop shortcut.cmd') + '"')
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Postbox.lnk'
          if (-not (Test-Path $lnk)) { throw 'Desktop shortcut was not created' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($link.TargetPath -notlike '*wscript.exe' -or $link.Arguments -notlike '*Postbox App.vbs*') {
            throw "Shortcut does not open the app window: $($link.TargetPath) $($link.Arguments)"
          }
          if (-not (Test-Path (Join-Path $root 'Postbox App.vbs'))) { throw 'Postbox App.vbs missing from package' }

          # App-window mode must fail loudly (non-zero exit + startup-error.log) when no browser is found
          $env:POSTBOX_BROWSER = (Join-Path $root 'no-such-browser.exe')
          Remove-Item Env:NO_BROWSER
          cmd.exe /c ('"' + (Join-Path $root 'Postbox.cmd') + '" --window')
          $windowExit = $LASTEXITCODE
          Remove-Item Env:POSTBOX_BROWSER
          $env:NO_BROWSER = '1'
          if ($windowExit -eq 0) { throw 'Postbox.cmd --window should fail without a usable browser' }
          if (-not (Test-Path (Join-Path $data 'startup-error.log'))) { throw 'startup-error.log was not written' }
          $global:LASTEXITCODE = 0
          Write-Host 'Packaged Windows edition OK'
      - uses: actions/upload-artifact@v4
        with:
          name: Postbox-windows-x64
          path: dist/Postbox-windows-x64.zip
          compression-level: 0
      - name: Attach Windows zip to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Postbox-windows-x64.zip --clobber
          } else {
            gh release create $tag dist/Postbox-windows-x64.zip --title $tag --generate-notes
          }

  windows-desktop:
    name: Build and smoke test Windows desktop installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop
      - name: Check Rust formatting
        run: |
          rustup component add rustfmt
          cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Prepare the update signing key
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # Releases sign the update with the project key (repository secrets, used by the build step).
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content (Join-Path $dir 'build.json')
            'UPDATE_SMOKE=0' >> $env:GITHUB_ENV
          } else {
            # Pull requests and main use a throwaway key that only these test builds trust.
            Push-Location desktop
            npm run tauri -- signer generate --ci -w (Join-Path $dir 'test.key')
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate the test update key' }
            Pop-Location
            $pub = (Get-Content (Join-Path $dir 'test.key.pub') -Raw).Trim()
            $updater = @{ pubkey = $pub; dangerousInsecureTransportProtocol = $true }
            @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = $updater } } |
              ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dir 'build.json')
            @{ version = '0.0.1'; bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = $updater } } |
              ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dir 'old.json')
            $testKey = (Get-Content (Join-Path $dir 'test.key') -Raw).Trim()
            Write-Host "::add-mask::$testKey"
            "TEST_UPDATE_KEY=$testKey" >> $env:GITHUB_ENV
            'UPDATE_SMOKE=1' >> $env:GITHUB_ENV
          }
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || env.TEST_UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run build:desktop -- --tauri-config ${{ runner.temp }}/update/build.json ${{ env.UPDATE_SMOKE == '1' && '--features update-test' || '' }}
      - name: Build an older test version for the update smoke test (not on tags)
        if: env.UPDATE_SMOKE == '1'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TEST_UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run build:desktop -- --reuse-payload --tauri-config ${{ runner.temp }}/update/old.json --features update-test --out Postbox-Desktop-old-setup.exe
      - name: Smoke test install, start, single instance, stop, upgrade, in-app update and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'dist\Postbox-Desktop-windows-x64-setup.exe'
          $inst = Join-Path $env:LOCALAPPDATA 'Postbox Desktop'
          $exe = Join-Path $inst 'postbox-desktop.exe'
          $data = Join-Path $PWD 'desktop-smoke-data'
          $env:DATA_DIR = $data
          $env:PORT = '47411'
          $base = 'http://127.0.0.1:47411'
          # Downloads go to a test folder; the DevTools port lets the smoke test click in the window.
          $downloads = Join-Path $PWD 'desktop-smoke-downloads'
          $env:POSTBOX_DOWNLOAD_DIR = $downloads
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=47412'
          $uninstallKey = 'Software\Microsoft\Windows\CurrentVersion\Uninstall'

          function Find-UninstallEntry([string]$hive) {
            Get-ChildItem "${hive}:\$uninstallKey" -ErrorAction SilentlyContinue |
              Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'Postbox Desktop' }
          }

          function Invoke-Installer {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
            Write-Host ("Install took {0:N1} s" -f $sw.Elapsed.TotalSeconds)
          }

          function Start-Desktop {
            $p = Start-Process -FilePath $exe -PassThru
            for ($i = 0; $i -lt 240; $i++) {
              try {
                $h = Invoke-RestMethod "$base/api/health" -TimeoutSec 2
                if ($h.status -eq 'ok' -and $h.app -eq 'postbox') { return $p }
              } catch { }
              if ($p.HasExited) { throw "postbox-desktop.exe exited early with $($p.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            throw 'Desktop app server did not become healthy within 120 seconds'
          }

          function Stop-Desktop {
            Stop-Process -Name 'postbox-desktop' -Force -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 40; $i++) {
              if (-not (Get-Process -Name 'postbox-node' -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Milliseconds 500
            }
            if (Get-Process -Name 'postbox-node' -ErrorAction SilentlyContinue) {
              throw 'postbox-node.exe did not stop within 20 seconds after the shell died'
            }
            if (Get-NetTCPConnection -LocalPort 47411 -State Listen -ErrorAction SilentlyContinue) {
              throw 'Port 47411 is still listening'
            }
            $running = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Postbox') -Filter 'running-*.json' -ErrorAction SilentlyContinue)
            if ($running.Count -gt 0) { throw "Running file left behind: $($running.Name -join ', ')" }
          }

          try {
            # 1. No elevation requested, size budget.
            $size = (Get-Item $setup).Length
            Write-Host ("Installer size: {0:N1} MB" -f ($size / 1MB))
            if ($size -gt 70MB) { throw 'Installer is larger than 70 MB' }
            $setupText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($setup))
            if (-not $setupText.Contains('level="asInvoker"')) { throw 'Installer manifest does not request asInvoker' }
            if ($setupText.Contains('requireAdministrator')) { throw 'Installer requests administrator rights' }

            # 2. Silent per-user install.
            Invoke-Installer
            foreach ($rel in @('postbox-desktop.exe', 'uninstall.exe', 'runtime\postbox-node.exe', 'app\server.js',
                'app\local.mjs', 'app\.next\server', 'app\.next\static', 'app\.next\node_modules',
                'app\drizzle\meta\_journal.json')) {
              if (-not (Test-Path (Join-Path $inst $rel))) { throw "Missing from install: $rel" }
            }
            $exeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            if ($exeText.Contains('requireAdministrator')) { throw 'postbox-desktop.exe requests administrator rights' }
            if (-not (Find-UninstallEntry 'HKCU')) { throw 'No HKCU uninstall entry' }
            if (Find-UninstallEntry 'HKLM') { throw 'Unexpected HKLM uninstall entry' }
            $wowKey = "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
            $wow = Get-ChildItem $wowKey -ErrorAction SilentlyContinue |
              Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'Postbox Desktop' }
            if ($wow) { throw 'Unexpected HKLM WOW6432Node uninstall entry' }
            foreach ($pf in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($pf -and (Test-Path (Join-Path $pf 'Postbox Desktop'))) { throw "Installed under $pf" }
            }
            $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Postbox Desktop.lnk'
            if (-not (Test-Path $lnk)) { throw 'Start Menu shortcut missing' }

            # 3. Start: server on loopback only, data in DATA_DIR.
            $null = Start-Desktop
            if (-not (Test-Path (Join-Path $data 'postbox.db'))) { throw 'postbox.db not created in DATA_DIR' }
            if (Test-Path (Join-Path $inst 'postbox.db')) { throw 'postbox.db created in the install folder' }
            foreach ($row in @(Get-NetTCPConnection -LocalPort 47411 -State Listen)) {
              if ($row.LocalAddress -ne '127.0.0.1') { throw "Listening on $($row.LocalAddress)" }
            }
            $wsId = @(Invoke-RestMethod "$base/api/workspaces")[0].id
            if (-not $wsId) { throw 'Default workspace was not created' }

            # 3b. Downloads from the window land in the download folder without overwriting, including
            #     server URLs, blobs and window.open exports.
            $envBody = @{ workspaceId = $wsId; name = 'Smoke'; variables = @() } | ConvertTo-Json
            $envId = (Invoke-RestMethod "$base/api/environments" -Method Post -ContentType 'application/json' -Body $envBody).id
            node scripts/desktop-download-smoke.mjs 47412 $base $downloads $envId
            if ($LASTEXITCODE -ne 0) { throw 'Desktop download smoke test failed' }

            # 4. Second launch focuses the first window and exits 0.
            $second = Start-Process -FilePath $exe -PassThru
            if (-not $second.WaitForExit(20000)) { throw 'Second launch did not exit within 20 seconds' }
            if ($second.ExitCode -ne 0) { throw "Second launch exited with $($second.ExitCode)" }
            $nodes = @(Get-Process -Name 'postbox-node' -ErrorAction SilentlyContinue)
            if ($nodes.Count -ne 1) { throw "Expected one postbox-node process, found $($nodes.Count)" }

            # 5. Killing the shell stops the server.
            Stop-Desktop

            # 6. Upgrade in place keeps the data.
            Invoke-Installer
            $null = Start-Desktop
            $ids = @(Invoke-RestMethod "$base/api/workspaces") | ForEach-Object { $_.id }
            if ($ids -notcontains $wsId) { throw 'Workspace missing after upgrade' }
            Stop-Desktop

            # 7. Uninstall removes the program and keeps the data.
            $u = Start-Process -FilePath (Join-Path $inst 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "Uninstaller exited with $($u.ExitCode)" }
            for ($i = 0; $i -lt 120; $i++) {
              if (-not (Test-Path $exe) -and -not (Find-UninstallEntry 'HKCU')) { break }
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path $exe) { throw 'postbox-desktop.exe still present after uninstall' }
            if (Find-UninstallEntry 'HKCU') { throw 'HKCU uninstall entry still present' }
            if (-not (Test-Path (Join-Path $data 'postbox.db'))) { throw 'Uninstall removed postbox.db' }

            # 8. In-app update (test builds only): version 0.0.1 finds the current build through a
            #    local latest.json, skips the check when turned off, rejects a bad signature, and
            #    updates in place without administrator rights, keeping the data.
            if ($env:UPDATE_SMOKE -eq '1') {
              $newVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $oldSetup = Join-Path $PWD 'dist\Postbox-Desktop-old-setup.exe'
              $upd = Join-Path $PWD 'desktop-update-smoke'
              $updUrl = 'http://127.0.0.1:47413'
              $serverLog = Join-Path $data 'logs\server.log'
              New-Item -ItemType Directory -Force $upd | Out-Null
              Copy-Item $setup (Join-Path $upd 'Postbox-Desktop-new-setup.exe')
              node scripts/write-update-manifest.mjs --version $newVersion --url "$updUrl/Postbox-Desktop-new-setup.exe" --signature-file "$setup.sig" --out (Join-Path $upd 'latest.json')
              if ($LASTEXITCODE -ne 0) { throw 'Could not write latest.json' }
              # The same installer announced with the signature of a different file.
              node scripts/write-update-manifest.mjs --version $newVersion --url "$updUrl/Postbox-Desktop-new-setup.exe" --signature-file "$oldSetup.sig" --out (Join-Path $upd 'bad-signature.json')
              if ($LASTEXITCODE -ne 0) { throw 'Could not write bad-signature.json' }
              $updServer = Start-Process -FilePath node -ArgumentList 'scripts/desktop-update-server.mjs', $upd, '47413' -PassThru -NoNewWindow
              $requests = Join-Path $upd 'requests.log'
              function Get-Requests { if (Test-Path $requests) { @(Get-Content $requests) } else { @() } }
              function Get-InstalledVersion { try { (Get-Item $exe -ErrorAction Stop).VersionInfo.ProductVersion } catch { '' } }

              $p = Start-Process -FilePath $oldSetup -ArgumentList '/S' -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "Old test build installer exited with $($p.ExitCode)" }
              if ((Get-InstalledVersion) -notlike '0.0.1*') { throw "Old test build reports version $(Get-InstalledVersion)" }
              $env:POSTBOX_UPDATE_DELAY_SECS = '5'
              $env:POSTBOX_UPDATE_AUTO = '1'

              # 8a. Turned off: no request reaches the endpoint.
              $env:POSTBOX_NO_UPDATE_CHECK = '1'
              $env:POSTBOX_UPDATE_ENDPOINT = "$updUrl/latest.json"
              $null = Start-Desktop
              Start-Sleep -Seconds 20
              if ((Get-Requests).Count -ne 0) { throw "Update check ran although POSTBOX_NO_UPDATE_CHECK=1: $(Get-Requests)" }
              Stop-Desktop
              Remove-Item Env:POSTBOX_NO_UPDATE_CHECK

              # 8b. Wrong signature: downloaded, rejected and logged; nothing installed.
              $env:POSTBOX_UPDATE_ENDPOINT = "$updUrl/bad-signature.json"
              $null = Start-Desktop
              for ($i = 0; $i -lt 120; $i++) {
                if (Select-String -Path $serverLog -Pattern 'update check failed' -Quiet) { break }
                Start-Sleep -Milliseconds 500
              }
              if (-not (Select-String -Path $serverLog -Pattern 'update check failed' -Quiet)) { throw "A bad signature was not reported; requests: $(Get-Requests)" }
              if ((Get-Requests) -notcontains 'Postbox-Desktop-new-setup.exe') { throw "The update was not downloaded: $(Get-Requests)" }
              if ((Get-InstalledVersion) -notlike '0.0.1*') { throw 'An update with a wrong signature was installed' }
              if (-not (Get-Process -Name 'postbox-desktop' -ErrorAction SilentlyContinue)) { throw 'The app exited after a rejected update' }
              Stop-Desktop

              # 8c. Valid update: installed in place, the app restarts, the data is kept.
              $env:POSTBOX_UPDATE_ENDPOINT = "$updUrl/latest.json"
              $before = @(Get-Process -Name 'postbox-desktop' -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
              $null = Start-Desktop
              $first = @(Get-Process -Name 'postbox-desktop' -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
              for ($i = 0; $i -lt 360; $i++) {
                if ((Get-InstalledVersion) -like "$newVersion*") { break }
                Start-Sleep -Milliseconds 500
              }
              if ((Get-InstalledVersion) -notlike "$newVersion*") { throw "The update was not installed (version $(Get-InstalledVersion))" }
              # The installer restarts Postbox as the signed-in user (through Explorer), so the new
              # process does not inherit this script's PORT and DATA_DIR. Check that it started,
              # then start the updated app with the test settings to check the data.
              $restarted = $null
              for ($i = 0; $i -lt 240 -and -not $restarted; $i++) {
                $restarted = Get-Process -Name 'postbox-desktop' -ErrorAction SilentlyContinue |
                  Where-Object { ($before + $first) -notcontains $_.Id }
                if (-not $restarted) { Start-Sleep -Milliseconds 500 }
              }
              if (-not $restarted) { throw 'The app did not start again after the update' }
              Stop-Desktop
              $null = Start-Desktop
              $ids = @(Invoke-RestMethod "$base/api/workspaces") | ForEach-Object { $_.id }
              if ($ids -notcontains $wsId) { throw 'Workspace missing after the in-app update' }
              if (Find-UninstallEntry 'HKLM') { throw 'The update wrote an HKLM uninstall entry' }
              foreach ($pf in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
                if ($pf -and (Test-Path (Join-Path $pf 'Postbox Desktop'))) { throw "The update installed under $pf" }
              }
              Stop-Desktop
              foreach ($name in 'POSTBOX_UPDATE_ENDPOINT', 'POSTBOX_UPDATE_AUTO', 'POSTBOX_UPDATE_DELAY_SECS') { Remove-Item "Env:$name" }
              Stop-Process -Id $updServer.Id -ErrorAction SilentlyContinue
              $u = Start-Process -FilePath (Join-Path $inst 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
              if ($u.ExitCode -ne 0) { throw "Uninstaller exited with $($u.ExitCode) after the update test" }
              Write-Host "In-app update OK: 0.0.1 -> $newVersion"
            }
            Write-Host 'Windows desktop installer OK'
          } catch {
            Write-Host '----- Postbox processes'
            Get-CimInstance Win32_Process -Filter "Name LIKE 'postbox%' OR Name LIKE 'Postbox%'" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "$($_.ProcessId) $($_.CreationDate) $($_.CommandLine)" }
            Write-Host '----- WebView2 processes and DevTools port'
            Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" -ErrorAction SilentlyContinue |
              Select-Object -First 3 | ForEach-Object { Write-Host $_.CommandLine }
            Get-NetTCPConnection -LocalPort 47412 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
            foreach ($log in @((Join-Path $data 'logs\server.log'), (Join-Path $data 'logs\server.log.1'), (Join-Path $data 'startup-error.log'))) {
              if (Test-Path $log) { Write-Host "----- $log"; Get-Content $log -Tail 200 }
            }
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Postbox-Desktop-windows-x64-setup
          path: dist/Postbox-Desktop-windows-x64-setup.exe
          compression-level: 0
      - name: Attach Windows desktop installer to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = 'dist/Postbox-Desktop-windows-x64-setup.exe'
          if (-not (Test-Path "$setup.sig")) { throw 'The release build has no update signature' }
          # latest.json is what installed apps read; its version must equal the tag.
          node scripts/write-update-manifest.mjs --version $tag --expect-version-of package.json --url "https://github.com/nkskater/postbox/releases/download/$tag/Postbox-Desktop-windows-x64-setup.exe" --signature-file "$setup.sig" --out dist/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not write latest.json' }
          $assets = @($setup, "$setup.sig", 'dist/latest.json')
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }

  docker:
    name: Build and smoke test container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: postbox:smoke
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - name: Check container health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs postbox-smoke; docker rm -fv postbox-smoke' EXIT
          docker run --detach --name postbox-smoke --publish 127.0.0.1:3000:3000 postbox:smoke
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --max-time 5 http://127.0.0.1:3000/api/health

  publish:
    name: Publish multi-platform image
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/nkskater/postbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-multiarch
          cache-to: type=gha,mode=max,scope=container-multiarch
